[build.environment]
  # Todas las variables del proyecto son NEXT_PUBLIC_* y públicas por diseño:
  # Next.js las incrusta en el bundle. La anon key de Supabase está protegida por RLS,
  # la URL de Supabase y el número de WhatsApp son datos públicos.
  # Nunca agregar aquí claves secretas (p. ej. service_role).
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_WA_NUMBER"
